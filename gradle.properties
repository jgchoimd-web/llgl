# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true

# Maven Central rate-limits shared egress IPs (HTTP 429), which Gradle reports
# as "plugin not found". Retry more times with a longer backoff before giving up.
systemProp.org.gradle.internal.repository.max.tentatives=8
systemProp.org.gradle.internal.repository.initial.backoff=2000

# AndroidX package structure.
android.useAndroidX=true
# Only keep the R class for each module's own resources.
android.nonTransitiveRClass=true

kotlin.code.style=official
